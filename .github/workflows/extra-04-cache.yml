name: Extar 04 - Cache dependencias

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read # Da permiso para leer y descargar archivos del repositorio.

jobs:
  test-with-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout # Checkout necesita permisos de descarga y de lectura
        uses: actions/checkout@v4 # Accion ya creada por GitHub

      - name: Configurar Python con cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip # 1ra vez descarga todo. 
                     # La siguiente ejecucion purde reutilizar la cache, 
                     # para ahorrar tiempo en proyectosgrandes

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar tests
        run: pytest
